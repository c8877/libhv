<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rtunnel admin</title>
<script>
(function () {
  try {
    var m = localStorage.getItem('rt_theme');
    if (m !== 'dark' && m !== 'color') m = 'light';
    document.documentElement.setAttribute('data-theme', m);
    var c = localStorage.getItem('rt_theme_color');
    if (m === 'color' && c) document.documentElement.style.setProperty('--accent', c);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">&#x2B21; RTUNNEL<span>ADMIN</span></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="side-foot">&#8230;</div>
  </aside>
  <div class="main-wrap">
    <header id="topbar">
      <button id="nav-toggle" type="button" aria-label="菜单" aria-controls="sidebar">&#9776;</button>
      <span id="crumb">&#27010;&#35272;</span>
      <span class="spacer"></span>
      <span id="relay-info">&#8212;</span>
      <span id="userbox" style="display:none">
        <button id="userbtn" type="button"></button>
        <div id="usermenu" style="display:none">
          <div id="userinfo"></div>
          <button id="logout" type="button">退出登录</button>
        </div>
      </span>
    </header>
    <main id="page"></main>
  </div>
</div>
<div id="nav-mask"></div>
<div id="toast"></div>
<script src="/admin_ui.js" defer></script>
<script src="/admin.js" defer></script>
<!-- 其余页面模块由 Router.lazy 按需加载 -->
</body>
</html>
